name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s tests -v

  fortran-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: two-phase-spin
            model: standard
            nlayers: 1
            h2_spin: 1
          - name: three-phase-spin
            model: standard
            nlayers: 2
            h2_spin: 1
          - name: three-phase-no-spin
            model: kida2024
            nlayers: 2
            h2_spin: 0
    name: Fortran build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install --yes gfortran make
      - run: python -m pip install numpy scipy
      - run: >-
          python scripts/build_smoke.py
          --model "${{ matrix.model }}"
          --nlayers "${{ matrix.nlayers }}"
          --h2-spin "${{ matrix.h2_spin }}"
          --layer-thickness 4
          --thin-ice-approximation 1
      - run: make clean
      - run: make -j2
